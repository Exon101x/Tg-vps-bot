# Render Blueprint: New -> Blueprint -> pick this repo -> fill in the prompted values -> Apply.
# Reference: https://render.com/docs/blueprint-spec
#
# FREE-PLAN FACTS (render.com/docs/free): the service sleeps after 15 minutes without inbound traffic, its disk is wiped on
# every restart/redeploy, Render may restart it at any time, and Render Postgres on the free plan expires after 30 days.
# That is why DATABASE_URL points at an external database and KEEP_ALIVE is on. For an always-on bot choose a paid
# plan (e.g. "starter") and set KEEP_ALIVE to "0".
services:
  - type: web
    name: vps-file-bot
    runtime: docker
    plan: free
    healthCheckPath: /healthz        # the bot answers 200 on $PORT before it even logs in to Telegram
    autoDeploy: true
    envVars:
      - key: API_ID                  # from my.telegram.org
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN               # from @BotFather
        sync: false
      - key: ALLOWED_USERS           # comma-separated Telegram user ids
        sync: false
      - key: DATABASE_URL            # postgresql://..., mysql://..., mongodb+srv://... (see README)
        sync: false
      - key: SECRET_KEY              # generated by Render; COPY IT somewhere safe (Environment tab) - it encrypts your saved servers
        generateValue: true
      - key: KEEP_ALIVE              # pings RENDER_EXTERNAL_URL every 10 min so a free service does not fall asleep
        value: "1"
      - key: LOG_LEVEL
        value: INFO

# Optional: a Render-managed PostgreSQL instead of an external database. Free databases expire after 30 days
# (14-day grace period to upgrade), so this suits trying things out. To use it, uncomment this block and replace the
# DATABASE_URL entry above with:
#      - key: DATABASE_URL
#        fromDatabase:
#          name: vpsbot-db
#          property: connectionString
#
# databases:
#   - name: vpsbot-db
#     plan: free
